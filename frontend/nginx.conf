events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # ==========================================
        # 1. CAPA DE CLIENTE: Frontend de React
        # ==========================================
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html; 
        }

        # ==========================================
        # 2. PROXY INVERSO: Auth Service (Node.js)
        # ==========================================
        location /api/v1/auth/ {
            proxy_pass http://auth-node:3001/api/v1/auth/;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🚀 ACCESO A SWAGGER DE NODE.JS (api-docs)
        location /api-docs {
            proxy_pass http://auth-node:3001/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        # ==========================================
        # 3. PROXY INVERSO: Orchestrator (Java)
        # ==========================================
        location /api/v1/orchestrator/ {
            proxy_pass http://orchestrator-java:8080;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🚀 ACCESO A SWAGGER DE JAVA (Springdoc)
        location /swagger-ui/ {
            proxy_pass http://orchestrator-java:8080/swagger-ui/;
            proxy_set_header Host $host;
        }
        location /v3/api-docs {
            proxy_pass http://orchestrator-java:8080/v3/api-docs;
            proxy_set_header Host $host;
        }


        # ==========================================
        # 4. PROXY INVERSO: Core Service (Python)
        # ==========================================
        # Creamos acceso directo a Python en Nginx SOLO para ver la documentación (Swagger)
        location /docs {
            proxy_pass http://core-service-python:8001/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://core-service-python:8001/openapi.json;
            proxy_set_header Host $host;
        }
    }
}